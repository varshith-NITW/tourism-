AWSTemplateFormatVersion: '2010-09-09'
Description: 'TourMatch AI - Complete AWS Cloud Architecture (ECS Fargate, RDS PostgreSQL, DocumentDB, ElastiCache Redis, ALB, S3)'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Deployment environment name'
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: 'OpenAI API Key for LangChain LLM execution'

Resources:
  # 1. VPC & Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tourmatch-vpc'

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  # 2. Amazon RDS: PostgreSQL 16 + PostGIS
  RDSDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnets for TourMatch PostgreSQL'
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]

  PostgreSQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: 'tourmatch_db'
      Engine: 'postgres'
      EngineVersion: '16.2'
      DBInstanceClass: 'db.t4g.medium'
      AllocatedStorage: '50'
      MasterUsername: 'tourmatch_admin'
      MasterUserPassword: 'TourMatchProdSecretPassword2026!'
      DBSubnetGroupName: !Ref RDSDBSubnetGroup
      PubliclyAccessible: false
      MultiAZ: true
      Tags:
        - Key: Service
          Value: 'PostgreSQL-PostGIS'

  # 3. Amazon DocumentDB (MongoDB-Compatible Document Store)
  DocDBSubnetGroup:
    Type: AWS::DocDB::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnets for DocumentDB (MongoDB compatible)'
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]

  DocDBCluster:
    Type: AWS::DocDB::DBCluster
    Properties:
      DBClusterIdentifier: !Sub '${EnvironmentName}-tourmatch-docdb'
      MasterUsername: 'docdb_admin'
      MasterUserPassword: 'DocDBSecretPassword2026!'
      DBSubnetGroupName: !Ref DocDBSubnetGroup
      Tags:
        - Key: Service
          Value: 'MongoDB-DocumentDB'

  # 4. Amazon ElastiCache (Redis Cluster)
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: 'Subnet group for Redis check-in caching'
      SubnetIds: [!Ref PublicSubnet1, !Ref PublicSubnet2]

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: 'redis'
      CacheNodeType: 'cache.t4g.small'
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      Tags:
        - Key: Service
          Value: 'Redis-Checkin-Cache'

  # 5. Amazon S3: Media & Hotel Photo Storage
  MediaS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'tourmatch-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  # 6. AWS ECS: Fargate Cluster for Node.js & FastAPI Microservices
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-tourmatch-ecs-cluster'

  # 7. Application Load Balancer (ALB)
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-tourmatch-alb'
      Scheme: 'internet-facing'
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      Type: 'application'

Outputs:
  ALBEndpoint:
    Description: 'Public URL of TourMatch Application Load Balancer'
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  PostgreSQLEndpoint:
    Description: 'PostgreSQL PostGIS Endpoint'
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address
  MediaBucketName:
    Description: 'S3 Bucket for Hotel Photos and PDFs'
    Value: !Ref MediaS3Bucket
