version: '3.8'

services:
  # 1. Frontend: React.js + Tailwind CSS
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tourmatch-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_NODE_API_URL=http://localhost:5000
      - VITE_AI_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend-node
      - ai-service
    networks:
      - tourmatch-net

  # 2. Core Backend: Node.js API Gateway
  backend-node:
    build:
      context: ./server-node
      dockerfile: Dockerfile
    container_name: tourmatch-backend-node
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tourmatch_db
      - POSTGRES_USER=tourmatch_user
      - POSTGRES_PASSWORD=tourmatch_secure_pass
      - MONGO_URI=mongodb://mongodb:27017/tourmatch_docs
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - tourmatch-net

  # 3. AI & ML Microservice: FastAPI + PyTorch + LangChain + OpenAI API
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tourmatch-ai-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - tourmatch-net

  # 4. Relational & Spatial Database: PostgreSQL + PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tourmatch-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tourmatch_db
      - POSTGRES_USER=tourmatch_user
      - POSTGRES_PASSWORD=tourmatch_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - tourmatch-net

  # 5. Document Store: MongoDB (Rich Media & Logs)
  mongodb:
    image: mongo:7.0
    container_name: tourmatch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - tourmatch-net

  # 6. Cache & Check-in Counter: Redis
  redis:
    image: redis:7.2-alpine
    container_name: tourmatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tourmatch-net

networks:
  tourmatch-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
